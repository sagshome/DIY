<div class="card shadow-sm mb-3">
    <div class="card-header">
        Delete {{ object_type }}
    </div>
    <div class="card-body p-2">
        <p>{{ extra_text }}</p>
        <form method="post" class="ioom_modal_form" action="{{request.path}}">
            {% csrf_token %}
            {{ modal_form.caller }}
            <p>Are you sure you want to delete "<b>{{ object }}</b>"?</p>
            <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-primary ioom-cancel">Cancel</button>
                    <button type="submit" class="btn btn-danger ">Delete</button>
            </div>
        </form>
    </div>
</div>
